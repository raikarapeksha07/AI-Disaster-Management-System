<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        :root {
            --bg-top:#081521;
            --bg-bottom:#1f5578;
            --panel:rgba(8, 18, 31, 0.82);
            --border:rgba(255,255,255,0.14);
            --text:#f4fbff;
            --muted:#b3cfde;
            --accent:#7ae3ff;
            --accent-strong:#56b8ff;
            --shadow:0 28px 60px rgba(0,0,0,0.28);
        }
        * { box-sizing:border-box; }
        body {
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:24px;
            font-family:"Segoe UI",sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(122,227,255,.18), transparent 25%),
                radial-gradient(circle at 85% 18%, rgba(255,255,255,.12), transparent 18%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }
        .card {
            width:min(520px, 100%);
            padding:34px;
            border-radius:28px;
            background:var(--panel);
            border:1px solid var(--border);
            box-shadow:var(--shadow);
            backdrop-filter:blur(18px);
        }
        h1 { margin:0 0 10px; font-size:34px; }
        p { color:var(--muted); line-height:1.6; }
        .message {
            min-height:24px;
            margin:16px 0 8px;
            color:#ffd0d0;
        }
        input, button {
            width:100%;
            padding:14px 16px;
            border-radius:16px;
            border:0;
            margin-top:12px;
            font-size:15px;
        }
        input {
            background:rgba(255,255,255,0.1);
            color:var(--text);
            border:1px solid rgba(255,255,255,0.06);
        }
        button {
            background:linear-gradient(135deg, var(--accent), var(--accent-strong));
            color:#04111f;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 14px 30px rgba(86,184,255,.25);
        }
        .link-row { margin-top:18px; }
        a { color:var(--accent); }
    </style>
</head>
<body>
    <section class="card">
        <h1>Set a New Password</h1>
        <p>Choose a new password for your account and then return to the login page.</p>
        <p id="message" class="message">{% if message %}{{ message }}{% endif %}</p>
        {% if is_valid %}
            <input id="password" type="password" placeholder="New password">
            <input id="confirmPassword" type="password" placeholder="Confirm new password">
            <button id="resetPasswordButton" type="button">Update Password</button>
        {% endif %}
        <div class="link-row"><a href="/login">Back to login</a></div>
    </section>
    <script>
        const isValid = {{ "true" if is_valid else "false" }};
        if (isValid) {
            document.getElementById("resetPasswordButton").addEventListener("click", async () => {
                const res = await fetch(window.location.pathname, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        password: document.getElementById("password").value,
                        confirm_password: document.getElementById("confirmPassword").value
                    })
                });
                const data = await res.json();
                const messageEl = document.getElementById("message");
                if (!res.ok || !data.success) {
                    messageEl.innerText = data.error || "Unable to reset password.";
                    return;
                }
                messageEl.style.color = "#caf7db";
                messageEl.innerText = data.message || "Password updated successfully.";
                setTimeout(() => {
                    window.location.href = "/login";
                }, 1200);
            });
        }
    </script>
</body>
</html>
